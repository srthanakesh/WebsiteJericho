<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.png">
<link rel="apple-touch-icon" href="/static/icon.png">
<title>Jericho</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }

  /* Fullscreen camera */
  #video {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    object-fit: cover; background: #000;
  }

  /* Top-left conversation overlay */
  #chat {
    position: fixed; top: 0; left: 0;
    max-width: min(72vw, 480px); max-height: 55vh;
    overflow-y: auto;
    padding: calc(1rem + env(safe-area-inset-top)) 1rem 1rem calc(1rem + env(safe-area-inset-left));
    display: flex; flex-direction: column; gap: .5rem;
    -webkit-mask-image: linear-gradient(to bottom, black 94%, transparent);
            mask-image: linear-gradient(to bottom, black 94%, transparent);
    scrollbar-width: none;      /* Firefox */
    -ms-overflow-style: none;   /* old Edge/IE */
  }
  #chat::-webkit-scrollbar { display: none; }  /* Chrome/Safari */
  .msg {
    padding: .55rem .8rem; border-radius: 12px;
    font-size: .95rem; line-height: 1.4;
    background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
    width: fit-content; max-width: 100%;
  }
  .msg.ai   { color: #eaf4ff; border-left: 3px solid #4da3ff; }
  .msg.user { color: #ffe9a8; border-left: 3px solid #ffc44d; }
  .thumbs { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .5rem; }
  .thumbs figure { margin: 0; text-align: center; }
  .thumbs img { height: 72px; border-radius: 8px; border: 2px solid rgba(255,255,255,.4); display: block; }
  .thumbs figcaption { font-size: .65rem; color: #cfe0f0; margin-top: 2px; }

  /* Middle-right buttons */
  #buttons {
    position: fixed; right: calc(1rem + env(safe-area-inset-right)); top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 1rem; align-items: center;
  }
  #fullscreen {
    position: fixed; top: calc(.8rem + env(safe-area-inset-top)); right: calc(.8rem + env(safe-area-inset-right));
    width: 44px; height: 44px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.5); background: rgba(0,0,0,.4);
    color: #fff; font-size: 1.15rem; cursor: pointer; backdrop-filter: blur(4px);
  }
  #fullscreen.hidden { display: none; }
  .round-btn {
    width: 72px; height: 72px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.85);
    background: rgba(0,0,0,.35); backdrop-filter: blur(4px);
    color: #fff; font-size: 1.7rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .1s, background .2s;
  }
  .round-btn:active { transform: scale(.92); }
  .round-btn:disabled { opacity: .45; cursor: wait; }
  .round-btn span { font-size: .62rem; font-weight: 700; letter-spacing: .05em; }
  #snap { background: rgba(255,255,255,.2); }
  #ask, #talk, #read { flex-direction: column; gap: 2px; }
  #monitor { flex-direction: column; gap: 2px; }
  #monitor.on { background: rgba(80,200,120,.55); border-color: #50c878; animation: pulse 2.5s infinite; }
  #talk.recording { background: rgba(255,60,60,.65); border-color: #ff5c5c; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.07); } }

  /* Ask input bar */
  #ask-bar {
    position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%);
    width: min(92vw, 560px); display: none; gap: .5rem;
  }
  #ask-bar.open { display: flex; }
  #ask-input {
    flex: 1; padding: .8rem 1rem; font-size: 1rem;
    border-radius: 999px; border: 1px solid rgba(255,255,255,.4);
    background: rgba(0,0,0,.6); color: #fff; outline: none;
    backdrop-filter: blur(6px);
  }
  #ask-send {
    padding: .8rem 1.2rem; border-radius: 999px; border: none;
    background: #4da3ff; color: #fff; font-weight: 700; cursor: pointer;
  }

  #status {
    position: fixed; bottom: .5rem; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.75); font-size: .85rem;
    background: rgba(0,0,0,.45); padding: .25rem .75rem; border-radius: 999px;
    display: none;
  }
  canvas { display: none; }

  /* Phone landscape: the 5-button column doesn't fit the short edge —
     lay buttons in a row along the bottom-right and shrink them. */
  @media (orientation: landscape) and (max-height: 520px) {
    #buttons {
      top: auto; transform: none; flex-direction: row;
      right: calc(1rem + env(safe-area-inset-right));
      bottom: calc(.8rem + env(safe-area-inset-bottom));
      gap: .6rem;
    }
    .round-btn { width: 58px; height: 58px; font-size: 1.35rem; border-width: 2px; }
    .round-btn span { font-size: .5rem; }
    #chat {
      max-width: 34vw; max-height: 58vh;
      padding: calc(.5rem + env(safe-area-inset-top)) .5rem .5rem calc(.5rem + env(safe-area-inset-left));
      gap: .3rem;
    }
    #chat .msg { font-size: .72rem; line-height: 1.3; padding: .35rem .55rem; border-radius: 9px; }
    #chat .thumbs img { height: 46px; }
    #chat .thumbs figcaption { font-size: .55rem; }
    #ask-bar {
      left: calc(1rem + env(safe-area-inset-left)); transform: none;
      bottom: calc(.9rem + env(safe-area-inset-bottom));
      width: min(48vw, 480px);
    }
    #status { bottom: auto; top: calc(.6rem + env(safe-area-inset-top)); }
  }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>

<div id="chat"></div>

<div id="buttons">
  <button id="snap" class="round-btn" title="Snap & identify">📸</button>
  <button id="ask" class="round-btn" title="Ask a question"><div>💬</div><span>ASK</span></button>
  <button id="talk" class="round-btn" title="Hold to talk"><div>🎤</div><span>HOLD</span></button>
  <button id="monitor" class="round-btn" title="Watch the room and remember where things are"><div>👁</div><span>WATCH</span></button>
  <button id="read" class="round-btn" title="Read this out loud"><div>📖</div><span>READ</span></button>
</div>

<div id="ask-bar">
  <input id="ask-input" type="text" placeholder="Ask about this medicine…" autocomplete="off">
  <button id="ask-send">Ask</button>
</div>

<button id="fullscreen" title="Fullscreen">⛶</button>
<div id="status"></div>
<canvas id="canvas"></canvas>
<audio id="player"></audio>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const chat = document.getElementById('chat');
const snapBtn = document.getElementById('snap');
const askBtn = document.getElementById('ask');
const askBar = document.getElementById('ask-bar');
const askInput = document.getElementById('ask-input');
const askSend = document.getElementById('ask-send');
const statusEl = document.getElementById('status');
const player = document.getElementById('player');

function setStatus(t) {
  statusEl.textContent = t;
  statusEl.style.display = t ? 'block' : 'none';
}

function addMsg(text, who, matches) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  if (matches && matches.length) {
    const row = document.createElement('div');
    row.className = 'thumbs';
    for (const m of matches) {
      if (!m.thumbnail) continue;
      const fig = document.createElement('figure');
      const img = document.createElement('img');
      img.src = m.thumbnail;
      img.alt = m.class_name;
      const cap = document.createElement('figcaption');
      cap.textContent = m.location
        ? `${m.class_name} · ${m.location}${m.seen_at ? ' · ' + m.seen_at : ''}`
        : `${m.class_name} · ${m.zone || '?'} · fr ${m.last_frame}`;
      fig.appendChild(img); fig.appendChild(cap);
      row.appendChild(fig);
    }
    div.appendChild(row);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 } }, audio: false
    });
    video.srcObject = stream;
  } catch (e) {
    setStatus('Camera access failed: ' + e.message);
  }
}

async function captureAndSend(question, mode) {
  if (!video.videoWidth) { setStatus('Camera not ready yet.'); return; }
  snapBtn.disabled = askBtn.disabled = true;
  setStatus(mode === 'read' ? 'Reading…' : 'Thinking…');

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));

  const form = new FormData();
  form.append('image', blob, 'snap.jpg');
  form.append('question', question || '');
  form.append('mode', mode || '');

  try {
    const resp = await fetch('/api/point-ask', { method: 'POST', body: form });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);

    addMsg(data.text, 'ai');
    setStatus(data.tts_error ? 'Voice unavailable' : '');

    if (data.audio_b64) {
      player.src = 'data:audio/mpeg;base64,' + data.audio_b64;
      player.play();
    }
  } catch (e) {
    setStatus('Error: ' + e.message);
  } finally {
    snapBtn.disabled = askBtn.disabled = false;
  }
}

snapBtn.addEventListener('click', () => captureAndSend(''));
document.getElementById('read').addEventListener('click', () => captureAndSend('', 'read'));

askBtn.addEventListener('click', () => {
  askBar.classList.toggle('open');
  if (askBar.classList.contains('open')) askInput.focus();
});

function submitAsk() {
  const q = askInput.value.trim();
  if (!q) return;
  askInput.value = '';
  askBar.classList.remove('open');
  addMsg(q, 'user');
  captureAndSend(q);
}
askSend.addEventListener('click', submitAsk);
askInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitAsk(); });

// --- Hold-to-talk voice loop ---
const talkBtn = document.getElementById('talk');
let recorder = null, chunks = [], micStream = null;

async function startRecording() {
  try {
    if (!micStream) micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) { setStatus('Mic access failed: ' + e.message); return; }
  chunks = [];
  recorder = new MediaRecorder(micStream);
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = sendVoice;
  recorder.start();
  talkBtn.classList.add('recording');
  setStatus('Listening… release to send');
}

function stopRecording() {
  if (recorder && recorder.state === 'recording') recorder.stop();
  talkBtn.classList.remove('recording');
}

async function sendVoice() {
  const audioBlob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
  if (audioBlob.size < 1000) { setStatus(''); return; } // too short, ignore
  setStatus('Thinking…');
  talkBtn.disabled = snapBtn.disabled = askBtn.disabled = true;

  const form = new FormData();
  form.append('audio', audioBlob, 'voice.webm');
  if (video.videoWidth) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const frame = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));
    form.append('image', frame, 'frame.jpg');
  }

  try {
    const resp = await fetch('/api/converse', { method: 'POST', body: form });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);

    if (data.question) addMsg(data.question, 'user');
    addMsg(data.text, 'ai', data.matches);
    setStatus(data.tts_error ? 'Voice unavailable' : '');

    if (data.audio_b64) {
      player.src = 'data:audio/mpeg;base64,' + data.audio_b64;
      player.play();
    }
  } catch (e) {
    setStatus('Error: ' + e.message);
  } finally {
    talkBtn.disabled = snapBtn.disabled = askBtn.disabled = false;
  }
}

// --- Live monitor mode ---
const monitorBtn = document.getElementById('monitor');
let monitorTimer = null;

async function sendMonitorFrame() {
  if (!video.videoWidth) return;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
  const form = new FormData();
  form.append('image', blob, 'frame.jpg');
  try {
    const resp = await fetch('/api/monitor-frame', { method: 'POST', body: form });
    const data = await resp.json();
    if (!data.skipped && data.objects) {
      setStatus(`👁 watching — remembering ${data.objects.length} item(s)`);
    }
  } catch (e) { /* keep monitoring quietly */ }
}

monitorBtn.addEventListener('click', () => {
  if (monitorTimer) {
    clearInterval(monitorTimer);
    monitorTimer = null;
    monitorBtn.classList.remove('on');
    setStatus('');
  } else {
    monitorBtn.classList.add('on');
    setStatus('👁 watching the room…');
    sendMonitorFrame();
    monitorTimer = setInterval(sendMonitorFrame, 8000);
  }
});

talkBtn.addEventListener('mousedown', startRecording);
talkBtn.addEventListener('mouseup', stopRecording);
talkBtn.addEventListener('mouseleave', stopRecording);
talkBtn.addEventListener('touchstart', e => { e.preventDefault(); startRecording(); });
talkBtn.addEventListener('touchend', e => { e.preventDefault(); stopRecording(); });

// --- Fullscreen (hidden when installed as an app or already fullscreen) ---
const fsBtn = document.getElementById('fullscreen');
function refreshFsBtn() {
  const standalone = matchMedia('(display-mode: standalone)').matches;
  fsBtn.classList.toggle('hidden', standalone || !!document.fullscreenElement);
}
fsBtn.addEventListener('click', () => {
  document.documentElement.requestFullscreen().catch(() => {});
});
document.addEventListener('fullscreenchange', refreshFsBtn);
refreshFsBtn();

initCamera();
</script>
</body>
</html>
